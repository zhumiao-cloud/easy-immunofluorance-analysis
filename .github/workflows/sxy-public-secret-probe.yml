name: SXY public secret probe
on:
  push:
    paths:
      - '.github/workflows/sxy-public-secret-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SXY_PSWD: ${{ secrets.SXY_PSWD }}
    steps:
      - name: Verify secret presence only
        shell: bash
        run: |
          set -euo pipefail
          set +x
          if [ -z "${SXY_PSWD:-}" ]; then
            echo "SXY_SECRET_AVAILABLE=NO"
            exit 20
          fi
          echo "::add-mask::$SXY_PSWD"
          echo "SXY_SECRET_AVAILABLE=YES"
