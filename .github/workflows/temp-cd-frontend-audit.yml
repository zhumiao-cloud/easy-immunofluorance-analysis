name: Temporary CloudDrive frontend download audit

# One-shot public/no-secret inspection; safe to remove after audit.
on:
  push:
    paths:
      - '.github/workflows/temp-cd-frontend-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public CloudDrive frontend assets
        shell: bash
        run: |
          set +x
          set -euo pipefail
          python3 - <<'PY'
          import re, urllib.request, urllib.parse
          base='https://cd.evren.cn/'
          req=urllib.request.Request(base,headers={'User-Agent':'Mozilla/5.0'})
          html=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','replace')
          srcs=re.findall(r'<script[^>]+src=["\']([^"\']+\.js(?:\?[^"\']*)?)["\']',html,re.I)
          urls=[]
          for s in srcs:
              u=urllib.parse.urljoin(base,s)
              if urllib.parse.urlsplit(u).hostname=='cd.evren.cn' and u not in urls: urls.append(u)
          print('HTML_BYTES',len(html),'JS_COUNT',len(urls))
          pats=['GetDownloadUrlPath','getDownloadUrlPath','get_direct_url','getDirectUrl','directUrl','downloadUrlPath','lazy_read','lazyRead']
          hits=0
          for u in urls[:60]:
              try:
                  rq=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
                  data=urllib.request.urlopen(rq,timeout=25).read()
                  if len(data)>20_000_000: continue
                  text=data.decode('utf-8','replace')
              except Exception:
                  continue
              found=[p for p in pats if p in text]
              if not found: continue
              hits+=1
              path=urllib.parse.urlsplit(u).path
              print('ASSET',path,'MATCHES',','.join(found),'BYTES',len(data))
              for p in found:
                  i=text.find(p); a=max(0,i-240); b=min(len(text),i+420)
                  snippet=re.sub(r'\s+',' ',text[a:b])
                  snippet=re.sub(r'([A-Za-z0-9_\-]{80,})','<LONG_LITERAL>',snippet)
                  print('SNIP',p,snippet[:700])
          print('MATCHED_ASSETS',hits)
          PY
